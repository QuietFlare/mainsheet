# Live probe for ADR 0005: a tool that waits on the terminal, and a skill shipped by a plugin.
# The timeout is short on purpose. Answer after more than 60 seconds and the run must still finish,
# because time spent waiting on you is not the run's.
name: human_probe
model: claude-sonnet-5
max_turns: 6
timeout_s: 60
permission_mode: acceptEdits
system_prompt: Use tools only for the task given. Follow the skill the task names.
task: Greet the person running you by following the probe:greet skill. Then stop.
tools:
  builtin: []
  servers:
    human:
      module: mainsheet.agent.tools.human
      allow: [ask_human]
plugins: [agents/probe_plugin]
skills: [probe:greet]
policy:
  version: 1
  tools:
    ask_human: {}
    Skill:
      args: {skill: {pattern: "^probe:greet$"}}
  budgets: {max_tool_calls: 4, max_cost_usd: 0.20}
  network: {allow: []}
